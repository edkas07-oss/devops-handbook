<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2240" viewBox="0 0 1600 2240" role="img" aria-labelledby="title desc">
  <title id="title">Personal Site Continuous Deployment Pipeline</title>
  <desc id="desc">Detailed vertical Jenkins CD pipeline from artifact selection and MinIO download through validation, Podman volume population, NGINX deployment, health verification, rollback, and cleanup.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.cluster{fill:#fff;stroke:#cbd5e1;stroke-width:2}.stage{stroke-width:1.5}.trigger{fill:#eff6ff;stroke:#60a5fa}.verify{fill:#f5f3ff;stroke:#a78bfa}.download{fill:#fdf2f8;stroke:#f472b6}.artifact{fill:#fff7ed;stroke:#fb923c}.volume{fill:#ecfdf5;stroke:#34d399}.deploy{fill:#ecfeff;stroke:#22d3ee}.validate{fill:#f0fdf4;stroke:#22c55e}.rollback{fill:#fef2f2;stroke:#f87171}.post{fill:#f1f5f9;stroke:#94a3b8}.node{fill:#fff;stroke:#64748b;stroke-width:1.7}.container{fill:#eff6ff;stroke:#2563eb;stroke-width:1.7}.store{fill:#ecfdf5;stroke:#059669;stroke-width:1.8}.credential{fill:#fff7ed;stroke:#ea580c;stroke-width:1.7}.decision{fill:#fefce8;stroke:#ca8a04;stroke-width:1.7}.title{font:700 24px Arial,sans-serif;fill:#0f172a}.clusterTitle{font:700 18px Arial,sans-serif;fill:#1e293b}.stageTitle{font:700 15px Arial,sans-serif;fill:#334155}.label{font:600 14px Arial,sans-serif;fill:#172554}.body{font:13px Arial,sans-serif;fill:#334155}.small{font:12px Arial,sans-serif;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:6 5;marker-end:url(#arrow)}.failureLine{fill:none;stroke:#dc2626;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}.successLine{fill:none;stroke:#16a34a;stroke-width:2;marker-end:url(#arrow)}.note{font:12px Arial,sans-serif;fill:#475569}.failureText{font:600 12px Arial,sans-serif;fill:#b91c1c}.successText{font:600 12px Arial,sans-serif;fill:#15803d}
    </style>
  </defs>
  <rect class="bg" width="1600" height="2240"/>
  <text x="800" y="42" text-anchor="middle" class="title">Personal Site Continuous Deployment Pipeline</text>

  <!-- Trigger and orchestration -->
  <rect class="cluster" x="60" y="75" width="1480" height="190" rx="14"/>
  <text x="85" y="108" class="clusterTitle">1. Release Selection and Orchestration</text>
  <rect class="node" x="125" y="140" width="245" height="82" rx="10"/>
  <text x="248" y="168" text-anchor="middle" class="label">Operator</text>
  <text x="248" y="190" text-anchor="middle" class="body">Build with Parameters</text>
  <text x="248" y="209" text-anchor="middle" class="small">ARTIFACT_NAME</text>
  <rect class="node" x="495" y="130" width="275" height="102" rx="10"/>
  <text x="633" y="159" text-anchor="middle" class="label">Jenkins Controller</text>
  <text x="633" y="181" text-anchor="middle" class="body">Job: personal-site-cd</text>
  <text x="633" y="202" text-anchor="middle" class="small">disable concurrent builds</text>
  <text x="633" y="220" text-anchor="middle" class="small">timeout: 20 minutes</text>
  <rect class="node" x="895" y="130" width="285" height="102" rx="10"/>
  <text x="1038" y="159" text-anchor="middle" class="label">Gitea SCM</text>
  <text x="1038" y="181" text-anchor="middle" class="body">personal-site repository</text>
  <text x="1038" y="202" text-anchor="middle" class="small">Jenkinsfile.cd</text>
  <text x="1038" y="220" text-anchor="middle" class="small">deployment/CONFIG + deploy.sh</text>
  <rect class="store" x="1290" y="130" width="190" height="102" rx="10"/>
  <text x="1385" y="159" text-anchor="middle" class="label">MinIO</text>
  <text x="1385" y="181" text-anchor="middle" class="body">Bucket: personal-site</text>
  <text x="1385" y="202" text-anchor="middle" class="small">immutable CI artifacts</text>
  <path class="line" d="M370 181 H488"/>
  <path class="dash" d="M895 181 H777"/>
  <text x="836" y="169" text-anchor="middle" class="note">load pipeline</text>

  <!-- Agent main flow -->
  <rect class="cluster" x="60" y="300" width="1080" height="1845" rx="14"/>
  <text x="85" y="333" class="clusterTitle">2. Jenkins Deployment Agent — label: builder-01 (rootless Podman)</text>
  <rect class="node" x="380" y="355" width="440" height="60" rx="10"/>
  <text x="600" y="381" text-anchor="middle" class="label">Jenkins SSH Agent</text>
  <text x="600" y="402" text-anchor="middle" class="body">Executes Jenkinsfile.cd on the NGINX runtime host</text>

  <rect class="stage verify" x="95" y="445" width="1010" height="120" rx="12"/>
  <text x="118" y="472" class="stageTitle">Stage 1: Verify Deployment Agent</text>
  <rect class="node" x="165" y="493" width="270" height="50" rx="9"/><text x="300" y="524" text-anchor="middle" class="body">Load deployment/CONFIG</text>
  <rect class="node" x="465" y="493" width="270" height="50" rx="9"/><text x="600" y="524" text-anchor="middle" class="body">Verify rootless Podman</text>
  <rect class="node" x="765" y="493" width="270" height="50" rx="9"/><text x="900" y="516" text-anchor="middle" class="body">Check NGINX image</text><text x="900" y="535" text-anchor="middle" class="small">and network web</text>
  <path class="line" d="M435 518 H458"/><path class="line" d="M735 518 H758"/>

  <rect class="stage trigger" x="95" y="590" width="1010" height="105" rx="12"/>
  <text x="118" y="617" class="stageTitle">Stage 2: Validate Parameters</text>
  <rect class="node" x="220" y="634" width="760" height="42" rx="9"/>
  <text x="600" y="660" text-anchor="middle" class="body">Require pattern: personal-site-&lt;BUILD_NUMBER&gt;.tar.gz — reject empty values and paths</text>

  <rect class="stage download" x="95" y="720" width="1010" height="185" rx="12"/>
  <text x="118" y="747" class="stageTitle">Stage 3: Download Artifact</text>
  <rect class="credential" x="135" y="778" width="210" height="82" rx="10"/>
  <text x="240" y="806" text-anchor="middle" class="label">Jenkins Credential</text><text x="240" y="828" text-anchor="middle" class="body">ID: minio-root</text><text x="240" y="848" text-anchor="middle" class="small">temporary injection</text>
  <rect class="container" x="405" y="770" width="270" height="98" rx="10"/>
  <text x="540" y="798" text-anchor="middle" class="label">MinIO Client Container</text><text x="540" y="820" text-anchor="middle" class="body">quay.io/minio/mc:latest</text><text x="540" y="841" text-anchor="middle" class="small">mc alias → stat → cp</text><text x="540" y="859" text-anchor="middle" class="small">ephemeral --rm</text>
  <rect class="store" x="760" y="778" width="280" height="82" rx="10"/>
  <text x="900" y="806" text-anchor="middle" class="label">Agent Workspace</text><text x="900" y="828" text-anchor="middle" class="body">selected *.tar.gz</text><text x="900" y="848" text-anchor="middle" class="small">test -s archive</text>
  <path class="dash" d="M345 819 H398"/><path class="line" d="M675 819 H753"/>
  <path class="line" d="M1290 181 H1215 V819 H683"/><text x="1196" y="515" text-anchor="end" class="note">download selected artifact</text>

  <rect class="stage artifact" x="95" y="930" width="1010" height="155" rx="12"/>
  <text x="118" y="957" class="stageTitle">Stage 4: Verify Artifact</text>
  <rect class="node" x="135" y="987" width="260" height="62" rx="9"/><text x="265" y="1013" text-anchor="middle" class="label">Inspect Archive</text><text x="265" y="1034" text-anchor="middle" class="small">tar -tzf → archive.list</text>
  <rect class="node" x="470" y="977" width="260" height="82" rx="9"/><text x="600" y="1005" text-anchor="middle" class="label">Safety Validation</text><text x="600" y="1027" text-anchor="middle" class="small">no absolute / parent path</text><text x="600" y="1046" text-anchor="middle" class="small">entries only under public/</text>
  <rect class="store" x="805" y="987" width="260" height="62" rx="9"/><text x="935" y="1013" text-anchor="middle" class="label">deploy-staging/public</text><text x="935" y="1034" text-anchor="middle" class="small">require non-empty index.html</text>
  <path class="line" d="M395 1018 H463"/><path class="line" d="M730 1018 H798"/>

  <rect class="stage volume" x="95" y="1110" width="1010" height="145" rx="12"/>
  <text x="118" y="1137" class="stageTitle">Stage 5: Prepare Rollback</text>
  <rect class="store" x="145" y="1168" width="260" height="58" rx="9"/><text x="275" y="1193" text-anchor="middle" class="label">www-personal-site</text><text x="275" y="1214" text-anchor="middle" class="small">create only when absent</text>
  <rect class="container" x="470" y="1158" width="260" height="78" rx="9"/><text x="600" y="1186" text-anchor="middle" class="label">Backup Container</text><text x="600" y="1208" text-anchor="middle" class="small">read existing volume :ro</text><text x="600" y="1226" text-anchor="middle" class="small">ephemeral --rm</text>
  <rect class="store" x="795" y="1158" width="260" height="78" rx="9"/><text x="925" y="1186" text-anchor="middle" class="label">Rollback State</text><text x="925" y="1208" text-anchor="middle" class="small">previous-content.tar.gz</text><text x="925" y="1226" text-anchor="middle" class="small">only if index.html exists</text>
  <path class="dash" d="M405 1197 H463"/><path class="line" d="M730 1197 H788"/>

  <rect class="stage volume" x="95" y="1280" width="1010" height="210" rx="12"/>
  <text x="118" y="1307" class="stageTitle">Stage 6: Populate Content Volume</text>
  <rect class="node" x="135" y="1340" width="220" height="62" rx="9"/><text x="245" y="1366" text-anchor="middle" class="label">Stop Old Runtime</text><text x="245" y="1387" text-anchor="middle" class="small">remove NGINX + loader</text>
  <rect class="container" x="405" y="1330" width="260" height="82" rx="9"/><text x="535" y="1358" text-anchor="middle" class="label">Loader Workflow</text><text x="535" y="1380" text-anchor="middle" class="small">clear volume → podman cp</text><text x="535" y="1399" text-anchor="middle" class="small">remove helper container</text>
  <rect class="store" x="760" y="1330" width="280" height="82" rx="9"/><text x="900" y="1358" text-anchor="middle" class="label">www-personal-site</text><text x="900" y="1380" text-anchor="middle" class="small">Hugo HTML + assets</text><text x="900" y="1399" text-anchor="middle" class="small">.artifact-name metadata</text>
  <path class="line" d="M355 1371 H398"/><path class="line" d="M665 1371 H753"/>
  <path class="dash" d="M935 1049 V1318"/><text x="948" y="1270" class="note">copy validated public/</text>
  <rect class="node" x="325" y="1435" width="550" height="35" rx="8"/><text x="600" y="1458" text-anchor="middle" class="small">Mark deployment-state/volume-update-started for conditional rollback</text>

  <rect class="stage deploy" x="95" y="1515" width="1010" height="165" rx="12"/>
  <text x="118" y="1542" class="stageTitle">Stage 7: Deploy NGINX</text>
  <rect class="node" x="135" y="1574" width="230" height="62" rx="9"/><text x="250" y="1600" text-anchor="middle" class="label">deploy.sh</text><text x="250" y="1621" text-anchor="middle" class="small">Jenkins cookie isolation</text>
  <rect class="container" x="445" y="1559" width="310" height="92" rx="10"/><text x="600" y="1587" text-anchor="middle" class="label">personal-site-web</text><text x="600" y="1609" text-anchor="middle" class="body">localhost/nginx-image:1.0</text><text x="600" y="1630" text-anchor="middle" class="small">network: web · healthcheck enabled</text>
  <rect class="store" x="835" y="1569" width="230" height="72" rx="9"/><text x="950" y="1597" text-anchor="middle" class="label">Read-only Content</text><text x="950" y="1619" text-anchor="middle" class="small">volume → /var/www/html:ro</text>
  <path class="line" d="M365 1605 H438"/><path class="dash" d="M835 1605 H762"/>

  <rect class="stage validate" x="95" y="1705" width="1010" height="180" rx="12"/>
  <text x="118" y="1732" class="stageTitle">Stage 8: Validate Deployment</text>
  <rect class="node" x="125" y="1764" width="230" height="78" rx="9"/><text x="240" y="1792" text-anchor="middle" class="label">HTTP Probe</text><text x="240" y="1814" text-anchor="middle" class="body">127.0.0.1:8091</text><text x="240" y="1833" text-anchor="middle" class="small">12 attempts × 5 seconds</text>
  <rect class="node" x="395" y="1764" width="240" height="78" rx="9"/><text x="515" y="1792" text-anchor="middle" class="label">Container Health</text><text x="515" y="1814" text-anchor="middle" class="body">require healthy</text><text x="515" y="1833" text-anchor="middle" class="small">18 attempts × 5 seconds</text>
  <rect class="node" x="675" y="1764" width="240" height="78" rx="9"/><text x="795" y="1792" text-anchor="middle" class="label">Mount Inspection</text><text x="795" y="1814" text-anchor="middle" class="body">/var/www/html</text><text x="795" y="1833" text-anchor="middle" class="small">assert RW=false</text>
  <rect class="decision" x="955" y="1764" width="120" height="78" rx="9"/><text x="1015" y="1792" text-anchor="middle" class="label">Result</text><text x="1015" y="1816" text-anchor="middle" class="small">success</text><text x="1015" y="1834" text-anchor="middle" class="small">or failure</text>
  <path class="line" d="M355 1803 H388"/><path class="line" d="M635 1803 H668"/><path class="line" d="M915 1803 H948"/>

  <rect class="stage post" x="95" y="1910" width="1010" height="105" rx="12"/>
  <text x="118" y="1937" class="stageTitle">Post: Always Cleanup Temporary Deployment Files</text>
  <rect class="node" x="205" y="1955" width="790" height="40" rx="9"/><text x="600" y="1980" text-anchor="middle" class="body">Remove loader container, deploy-staging, deployment-state, and downloaded personal-site-*.tar.gz</text>
  <path class="successLine" d="M1015 1842 V1870 H600 V1903"/><text x="820" y="1862" class="successText">success</text>

  <rect class="stage rollback" x="95" y="2040" width="1010" height="80" rx="12"/>
  <text x="118" y="2067" class="stageTitle">Post Failure: Conditional Rollback</text>
  <text x="600" y="2092" text-anchor="middle" class="body">If volume update started and backup exists: stop runtime → restore previous content → run deploy.sh</text>

  <!-- Runtime endpoint and rollback branch -->
  <rect class="cluster" x="1180" y="1080" width="360" height="880" rx="14"/>
  <text x="1205" y="1113" class="clusterTitle">3. Runtime and Recovery</text>
  <rect class="store" x="1230" y="1160" width="260" height="105" rx="12"/>
  <text x="1360" y="1190" text-anchor="middle" class="label">Podman Named Volume</text><text x="1360" y="1213" text-anchor="middle" class="body">www-personal-site</text><text x="1360" y="1235" text-anchor="middle" class="small">persistent static content</text><text x="1360" y="1254" text-anchor="middle" class="small">not a host bind mount</text>
  <rect class="container" x="1230" y="1340" width="260" height="125" rx="12"/>
  <text x="1360" y="1370" text-anchor="middle" class="label">NGINX Container</text><text x="1360" y="1393" text-anchor="middle" class="body">personal-site-web</text><text x="1360" y="1415" text-anchor="middle" class="small">8091 → 80 · 8443 → 443</text><text x="1360" y="1435" text-anchor="middle" class="small">2224 → 22 · network web</text><text x="1360" y="1454" text-anchor="middle" class="small">content mount read-only</text>
  <rect class="node" x="1230" y="1535" width="260" height="85" rx="12"/>
  <text x="1360" y="1565" text-anchor="middle" class="label">Website Endpoint</text><text x="1360" y="1588" text-anchor="middle" class="body">http://runtime-host:8091/</text><text x="1360" y="1609" text-anchor="middle" class="small">served static Hugo site</text>
  <rect class="store" x="1230" y="1710" width="260" height="100" rx="12"/>
  <text x="1360" y="1740" text-anchor="middle" class="label">Previous Content Backup</text><text x="1360" y="1763" text-anchor="middle" class="body">previous-content.tar.gz</text><text x="1360" y="1785" text-anchor="middle" class="small">workspace deployment-state</text><text x="1360" y="1803" text-anchor="middle" class="small">temporary, mode 077</text>
  <path class="dash" d="M1105 1371 H1170 V1213 H1223"/><text x="1153" y="1295" text-anchor="end" class="note">populate</text>
  <path class="dash" d="M1105 1605 H1170 V1403 H1223"/><text x="1153" y="1500" text-anchor="end" class="note">run</text>
  <path class="line" d="M1360 1465 V1528"/>
  <path class="dash" d="M1055 1197 H1170 V1760 H1223"/><text x="1152" y="1670" text-anchor="end" class="note">backup</text>
  <path class="failureLine" d="M1075 1803 H1160 V1875 H1360 V1817"/><text x="1180" y="1862" class="failureText">validation failure</text>
  <path class="failureLine" d="M1230 1760 H1160 V2080 H1112"/><text x="1172" y="2025" class="failureText">restore</text>
</svg>
